# CI through the reusable workflow in headlesslab/.github. The pin is a full
# commit SHA of that repository's main; Dependabot moves it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    uses: headlesslab/.github/.github/workflows/go.yml@0d29bb8c9b1426159c03ae4a583487083a3462d0 # main
    with:
      coverage-threshold: 100
      # File locks and directory renames differ per OS, so the suite runs on all three.
      cross-platform: true
